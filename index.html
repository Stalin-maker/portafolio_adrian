<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="3PhSOxoRhf74t0zWgiWGlI8K0dBORuK6s49oTcL10yg" />
    <meta name="description" content="Portafolio digital de Adrián Romano Pérez, karateca de La Vega, República Dominicana">
    <title>Adrián Romano - Portafolio Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. ESTILOS BASE Y VARIABLES (Temática Oscura)
           ========================================== */
        :root {
            --bg-principal: #0d0f12;      /* Gris oscuro profundo / Casi negro */
            --bg-tarjetas: #161a1f;       /* Gris intermedio para contenedores */
            --color-texto-p: #94a3b8;     /* Gris claro para textos descriptivos (Grotesca) */
            --color-texto-h: #ffffff;     /* Blanco puro para títulos (Geométrica) */
            --acento-neon: #00f2fe;       /* Azul neón tecnológico para iluminación */
            --acento-glow: rgba(0, 242, 254, 0.4); 
            --fuente-titulos: 'Montserrat', sans-serif;
            --fuente-cuerpo: 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: var(--fuente-cuerpo);
            background-color: var(--bg-principal);
            color: var(--color-texto-p);
            overflow: hidden; /* Mantiene la estética de Splashpage fija */
        }

        /* ==========================================
           2. CONTENEDOR PRINCIPAL (ROTULADO: PORTADA)
           ========================================== */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            
            /* CARGA DE PORTADA: Centrada, proporcional y rellenando el espacio.
               Se mantiene el archivo local 'portada_adrian.png' con las mismas propiedades. */
            background: linear-gradient(180deg, rgba(13,15,18,0.85) 0%, rgba(13,15,18,0.3) 50%, rgba(13,15,18,0.95) 100%), 
                        url('portada_adrian.png') no-repeat center center;
            background-size: cover;
            background-position: center;
        }

        /* ==========================================
           3. CABECERA Y MONOGRAMA
           ========================================== */
        .header-portafolio {
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        /* Espacio para el logotipo/monograma de Adrián */
        .contenedor-monograma {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            border: 2px solid var(--acento-neon);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(22, 26, 31, 0.9);
            box-shadow: 0 0 15px var(--acento-glow);
            overflow: hidden; /* Asegura que la imagen no sobresalga */
            padding: 10px;    /* Margen interno para el monograma */
        }

        /* Ajuste de la imagen local del monograma */
        .img-monograma {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción sin distorsionar */
            display: block;
        }

        .origen-atleta {
            font-family: var(--fuente-titulos);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--acento-neon);
            font-weight: 700;
        }

        /* ==========================================
           4. CONTENIDO CENTRAL (TIPOGRAFÍA GEOMÉTRICA)
           ========================================== */
        .contenido-central {
            text-align: center;
            max-width: 800px;
            z-index: 10;
            padding: 0 10px;
        }

        .nombre-atleta {
            font-family: var(--fuente-titulos);
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--color-texto-h);
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); /* Refuerza la lectura sobre la fotografía */
        }

        .disciplina-estilo {
            font-family: var(--fuente-titulos);
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--color-texto-h);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Filosofía Shito-Ryu (Dojo Kun) adaptada de forma elegante */
        .filosofia-dojokun {
            font-family: var(--fuente-cuerpo);
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: var(--color-texto-p);
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid rgba(0, 242, 254, 0.3);
            border-right: 1px solid rgba(0, 242, 254, 0.3);
            padding: 0 20px;
            background-color: rgba(13, 15, 18, 0.6); /* Fondo sutil para total legibilidad */
            border-radius: 4px;
        }

        /* ==========================================
           5. BOTÓN DE ACCIÓN (Efecto de Iluminación)
           ========================================== */
        .seccion-boton {
            z-index: 10;
            margin-bottom: 20px;
        }

        .btn-interactivo {
            font-family: var(--fuente-titulos);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--bg-principal);
            background-color: var(--acento-neon);
            border: none;
            padding: 16px 36px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Cambio de iluminación al pasar el mouse (Hover effect) */
        .btn-interactivo:hover {
            background-color: #ffffff;
            color: var(--bg-principal);
            box-shadow: 0 0 25px var(--acento-neon), 0 0 40px var(--acento-glow);
            transform: translateY(-2px);
        }

        .btn-interactivo:active {
            transform: translateY(1px);
        }

        /* Responsive para dispositivos móviles */
        @media (max-width: 768px) {
            .nombre-atleta { font-size: 2.5rem; }
            .disciplina-estilo { font-size: 1rem; letter-spacing: 4px; }
            .filosofia-dojokun { font-size: 0.95rem; }
            .contenedor-monograma { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>

    <main class="splash-container">
        
        <header class="header-portafolio">
            <div class="contenedor-monograma">
                <img src="monograma_adrian.png" alt="Monograma Adrián Romano" class="img-monograma">
            </div>
            <p class="origen-atleta">La Vega, RD</p>
        </header>

        <section class="contenido-central">
            <h1 class="nombre-atleta">Adrián Romano</h1>
            <p class="disciplina-estilo">Karate Do • Shito-Ryu</p>
            
            <p class="filosofia-dojokun">
                Guiado por los principios del <em>Dojo Kun</em>: la búsqueda de la perfección del carácter, la lealtad inquebrantable, el esfuerzo constante, el respeto a los demás y el absoluto autocontrol en cada combate.
            </p>
        </section>

        <div class="seccion-boton">
            <button class="btn-interactivo" onclick="entrarPortafolio()">
                Saber más de Adrián
            </button>
        </div>

    </main>

    <script>
        // Transición interactiva inmediata hacia el archivo 'portafolio.html'
        function entrarPortafolio() {
            window.location.href = "portafolio.html";
        }
    </script>

</body>
</html>
